<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelForge · 网页图片编辑器</title>
    <meta name="description" content="PixelForge — 运行于浏览器的轻量级专业图片编辑器" />
    <script>
      try {
        const theme = localStorage.getItem('pixelforge-theme')
        const language = localStorage.getItem('pixelforge-language')
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
